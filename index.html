<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#0b1026">

<!-- Link previews. These are what make the URL render as a card when it's
     pasted into WhatsApp, Telegram, Discord, iMessage, Slack, X, etc.
     og:image MUST be an absolute URL — relative paths are ignored. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="STACK RUSH">
<meta property="og:title" content="STACK RUSH — how high can you go?">
<meta property="og:description" content="One tap, one tower. Drop the block, line it up, and see how high you can stack before it all goes wrong.">

<meta name="twitter:image" content="https://zamesdean.github.io/og.jpg">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<style>
  /* ---------------------------------------------------------------
     STACK RUSH — a one-tap stacking game.
     Everything is in this one file so you can drop it on any host.
     Palette: deep midnight blue -> the tower cycles through warm
     neon so the stack itself is the brightest thing on screen.
  ----------------------------------------------------------------*/
  :root{
    --bg-top:#0b1026;
    --bg-bot:#161d3f;
    --ink:#f4f6ff;
    --muted:#8a93c2;
    --accent:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;
  }
  #wrap{
    position:relative;
    width:100%;height:100%;
    max-width:480px;   /* phone-shaped even on desktop */
    margin:0 auto;
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;}

  /* on-screen text overlays */
  #hud{
    position:absolute;top:0;left:0;right:0;
    padding:22px 24px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;
  }
  #score{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px;
    text-shadow:0 4px 24px rgba(0,0,0,.4);}
  #best{font-size:13px;color:var(--muted);text-align:right;font-weight:600;
    letter-spacing:.5px;margin-top:6px;}

  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
    background:rgba(9,12,30,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    transition:opacity .25s ease;
  }
  .hidden{opacity:0;pointer-events:none;}

  .title{
    font-size:56px;font-weight:800;letter-spacing:-2px;line-height:.95;
    background:linear-gradient(120deg,#ffd166,#ff6b9d,#8b7bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px;
  }
  .sub{color:var(--muted);font-size:15px;font-weight:600;margin-bottom:40px;letter-spacing:.3px;}
  .cta{
    font-size:20px;font-weight:700;letter-spacing:.5px;
    padding:16px 40px;border-radius:999px;border:none;cursor:pointer;
    background:var(--accent);color:#12172e;
    box-shadow:0 8px 30px rgba(255,209,102,.35);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  .go-score{font-size:88px;font-weight:800;line-height:1;letter-spacing:-3px;margin-bottom:4px;}
  .go-label{color:var(--muted);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:28px;}
  .go-best{color:var(--accent);font-size:15px;font-weight:700;margin-bottom:34px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn2{
    font-size:16px;font-weight:700;padding:14px 26px;border-radius:999px;
    border:1.5px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);cursor:pointer;
  }
  .btn2.primary{background:var(--accent);color:#12172e;border-color:var(--accent);}
  /* --- challenge mode: shown when the URL carries ?c=N --- */
  .gone{display:none !important;}
  .chal{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:38px;}
  .chal-label{color:var(--muted);font-size:12px;font-weight:700;
    letter-spacing:1.6px;text-transform:uppercase;}
  .chal-num{font-size:92px;font-weight:800;line-height:1;letter-spacing:-4px;
    color:var(--accent);text-shadow:0 6px 34px rgba(255,209,102,.35);}
  .go-chal{font-size:15px;font-weight:800;letter-spacing:.3px;
    margin-bottom:12px;color:var(--muted);}
  .go-chal.win{color:#7ee79f;}

  .toast{
    position:absolute;bottom:38px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#fff;color:#12172e;font-weight:700;font-size:14px;
    padding:11px 20px;border-radius:999px;opacity:0;transition:.3s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion:reduce){.cta{animation:none;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="best">BEST 0</div>
  </div>

  <!-- Start -->
  <div class="screen" id="startScreen">
    <div class="title">STACK<br>RUSH</div>
    <div class="chal gone" id="chalBanner">
      <div class="chal-label" id="chalLabel">Your target</div>
      <div class="chal-num" id="chalNum">0</div>
      <div class="chal-label">blocks to beat</div>
    </div>
    <div class="sub" id="startSub">Tap to drop the block.<br>Line it up. How high can you go?</div>
    <button class="cta" id="startBtn">TAP TO PLAY</button>
  </div>

  <!-- Game over -->
  <div class="screen hidden" id="overScreen">
    <div class="go-score" id="finalScore">0</div>
    <div class="go-label">blocks stacked</div>
    <div class="go-chal gone" id="chalResult"></div>
    <div class="go-best" id="finalBest">Best 0</div>
    <div class="row">
      <button class="btn2 primary" id="retryBtn">Play again</button>
      <button class="btn2" id="shareBtn">Share score</button>
    </div>
  </div>

  <div class="toast" id="toast">Copied! Paste it anywhere.</div>
</div>

<script>
/* ============================================================
   STACK RUSH  —  core game
   ------------------------------------------------------------
   Controls: tap / click / spacebar to drop the moving block.
   Score = number of blocks landed. Overhang gets sliced off,
   so each slightly-off drop makes the next block narrower.
   Miss completely -> game over.
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

// --- persistent best score ---------------------------------
let best = +(localStorage.getItem('stackrush_best') || 0);
function saveBest(){ 
  localStorage.setItem('stackrush_best', best);
}

// --- sizing / retina ---------------------------------------
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// --- game state --------------------------------------------
const BLOCK_H = 42;          // pixel height of each block
let blocks;                  // stacked blocks: {x,w,hue}
let moving;                  // the block currently sliding
let dir;                     // slide direction
let speed;                   // slide speed (pixels per second)
let score;                   // blocks landed
let camY;                    // camera vertical offset (scroll up)
let targetCamY;
let state;                   // 'start' | 'play' | 'over'
let shake;                   // screen-shake amount
let flashes;                 // perfect-drop flashes
let lastTime = 0;            // for delta time calculation

// --- challenge mode -----------------------------------------
// A shared link carries the sender's score as ?c=N. The receiver then
// plays against that number: a target line is drawn at height N and the
// run is "won" by placing a block above it. No backend, no accounts —
// the score rides in the URL, and beating it produces a new ?c= link,
// which is what turns a one-off brag into a rally.
const challenge = (()=>{
  const n = parseInt(new URLSearchParams(location.search).get('c'), 10);
  return (Number.isFinite(n) && n > 0 && n < 10000) ? n : 0;
})();
let beaten;                  // did this run clear the target?
let target;                  // the number to beat on this run
let targetIsRival;           // is the target a friend's, or your own best?

// The line to beat is always the highest bar in play: a friend's linked
// score, or your own record. Recomputed every run, so it climbs by itself
// as you improve — there is never a run without something to chase.
function setTarget(){
  target = Math.max(challenge, best);
  targetIsRival = challenge > 0 && challenge >= best;
}

function baseWidth(){ return Math.min(W * 0.62, 260); }

function reset(){
  blocks = [];
  const bw = baseWidth();
  const startX = (W - bw) / 2;
  // foundation block
  blocks.push({ x:startX, w:bw, hue:210 });
  score = 0;
  camY = 0; targetCamY = 0;
  shake = 0; flashes = [];
  beaten = false;
  setTarget();
  lastTime = 0;
  spawn();
}

function spawn(){
  const top = blocks[blocks.length-1];
  const hue = (210 + blocks.length * 24) % 360;
  
  // Pixels per second (delta-timed, so 60Hz and 144Hz play the same).
  //
  // Uncapped on purpose: the old min(..., 850) froze the difficulty at 42
  // blocks, and a precise player then regrew width faster than they shaved
  // it and simply never died.
  //
  // The slope is 20, not 12, because at 12 the game only got tense around
  // the 21st block — longer than a typical whole run, so most players spent
  // the entire game coasting. The opening speed is left alone so a first
  // drop still reads as gentle; it's the climb that bites now.
  speed = 350 + blocks.length * 20;
  
  // start off-screen on alternating sides
  const fromLeft = blocks.length % 2 === 0;
  moving = { x: fromLeft ? -top.w : W, w: top.w, hue };
  dir = fromLeft ? 1 : -1;
}

// y position (screen space) of the Nth block from bottom
function blockY(indexFromBottom){
  return H - 90 - indexFromBottom * BLOCK_H + camY;
}

function drop(){
  if(state !== 'play') return;
  const top = blocks[blocks.length-1];
  const overlapLeft = Math.max(moving.x, top.x);
  const overlapRight = Math.min(moving.x + moving.w, top.x + top.w);
  const overlap = overlapRight - overlapLeft;

  if(overlap <= 0){            // total miss -> game over
    gameOver();
    return;
  }

  const perfect = Math.abs(moving.x - top.x) < 6;
  let w = overlap;
  let x = overlapLeft;

  if (perfect) {
    // +8, not +16: the bigger reward let good players out-regrow their
    // own mistakes, which is what inflated scores into the hundreds.
    const bw = baseWidth();
    w = Math.min(top.w + 8, bw);
    x = top.x + (top.w - w) / 2;
  }

  blocks.push({ x, w, hue: moving.hue, perfectFlash: perfect ? 1 : 0 });
  score++;
  document.getElementById('score').textContent = score;

  if(perfect){
    shake = 6;
    flashes.push({ x:x+w/2, y:blockY(blocks.length-1), r:8, life:1 });
    beep(660);
  } else {
    beep(330);
  }

  // the moment the bar falls — make it unmistakable
  if(target && !beaten && score > target){
    beaten = true;
    shake = 18;
    flashes.push({ x:W/2, y:blockY(blocks.length-1), r:10, life:1 });
    beep(880);
    setTimeout(()=>beep(1320), 110);
  }

  // scroll the camera so the tower stays roughly centred once tall
  if(blocks.length > 6) targetCamY += BLOCK_H;

  spawn();
}

function gameOver(){
  state = 'over';
  if(score > best){ 
    best = score; 
    saveBest(); 
  }
  document.getElementById('finalScore').textContent = score;

  const cr = document.getElementById('chalResult');
  if(target){
    cr.classList.remove('gone');
    cr.classList.toggle('win', beaten);
    if(beaten){
      cr.textContent = targetIsRival ? `You beat ${target}!` : 'New personal best!';
    } else {
      const need = target - score + 1;
      cr.textContent = targetIsRival
        ? `${need} more to beat ${target}`
        : `${need} more to beat your best`;
    }
  } else {
    cr.classList.add('gone');
  }

  document.getElementById('finalBest').textContent = 'Best ' + best;
  document.getElementById('best').textContent = 'BEST ' + best;
  show('overScreen');
}

// --- tiny sound (WebAudio, no files) -----------------------
let actx;
function beep(freq){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'triangle';
    g.gain.value = 0.06;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.15);
    o.stop(actx.currentTime + 0.15);
  }catch(e){}
}

// --- render loop -------------------------------------------
function draw(time){
  requestAnimationFrame(draw);

  // Delta time ensures consistent speed on 120Hz/144Hz monitors
  if(!lastTime) lastTime = time;
  const dt = Math.min((time - lastTime) / 1000, 0.05); // cap at 0.05 to prevent bugs on lag
  lastTime = time;

  // smooth camera + shake decay
  camY += (targetCamY - camY) * 0.12;
  shake *= 0.85;
  const sx = (Math.random()-0.5) * shake;
  const sy = (Math.random()-0.5) * shake;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(sx, sy);

  // draw stacked blocks
  for(let i=0;i<blocks.length;i++){
    const b = blocks[i];
    paintBlock(b.x, blockY(i), b.w, b.hue, false, b.perfectFlash);
    
    if (b.perfectFlash > 0) {
      b.perfectFlash -= dt * 2.5;
      if (b.perfectFlash < 0) b.perfectFlash = 0;
    }
  }

  drawTarget();

  // move + draw the active block
  if(state === 'play'){
    moving.x += dir * speed * dt;
    const top = blocks[blocks.length-1];
    if(moving.x + moving.w > W + moving.w*0.15){ dir = -1; }
    if(moving.x < -moving.w*0.15){ dir = 1; }
    paintBlock(moving.x, blockY(blocks.length), moving.w, moving.hue, true);
  }

  // perfect-drop flashes
  for(let i=flashes.length-1;i>=0;i--){
    const f = flashes[i];
    f.r += 3; f.life -= 0.06;
    if(f.life<=0){ flashes.splice(i,1); continue; }
    ctx.beginPath();
    ctx.arc(f.x, f.y+BLOCK_H/2, f.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,255,255,${f.life})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

// Dashed line at the challenger's height, plus a marker pill. The line
// rides on blockY() so it scrolls with the camera for free. When the
// target is above the viewport the pill sticks to the top edge with an
// arrow, so you always know how far there is left to climb.
function drawTarget(){
  if(!target) return;
  const ly = blockY(target);
  const rgb = beaten ? '126,231,159' : '255,209,102';

  if(ly > 6 && ly < H - 6){
    ctx.save();
    ctx.setLineDash([9,8]);
    ctx.strokeStyle = `rgba(${rgb},.65)`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
    ctx.restore();
  }

  const above = ly <= 6;
  const label = beaten
    ? (targetIsRival ? 'BEAT ' + target : 'NEW BEST')
    : (above ? target + ' \u2191' : String(target));
  const py = Math.max(28, Math.min(ly - 15, H - 28));
  ctx.save();
  ctx.font = '800 13px "Segoe UI", system-ui, sans-serif';
  const pw = ctx.measureText(label).width + 20, ph = 23;
  const px = W - pw - 14;
  ctx.fillStyle = `rgba(${rgb},.95)`;
  roundRect(px, py - ph/2, pw, ph, 11); ctx.fill();
  ctx.fillStyle = '#12172e';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, px + pw/2, py);
  ctx.restore();
}

function paintBlock(x, y, w, hue, active, flashAlpha = 0){
  const grad = ctx.createLinearGradient(x, y, x, y+BLOCK_H);
  grad.addColorStop(0, `hsl(${hue} 85% 68%)`);
  grad.addColorStop(1, `hsl(${hue} 80% 54%)`);
  ctx.fillStyle = grad;
  roundRect(x, y, w, BLOCK_H-3, 6);
  ctx.fill();
  
  // top edge highlight (skip on very narrow blocks)
  if(w > 8){
    ctx.fillStyle = `hsla(${hue} 90% 82% / .6)`;
    roundRect(x+3, y+2, w-6, 4, 2);
    ctx.fill();
  }
  
  if(active){
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1;
    roundRect(x, y, w, BLOCK_H-3, 6); ctx.stroke();
  }
  
  if(flashAlpha > 0){
    ctx.strokeStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.lineWidth = 3;
    roundRect(x, y, w, BLOCK_H-3, 6); ctx.stroke();
  }
}

function roundRect(x,y,w,h,r){
  w = Math.max(0, w); h = Math.max(0, h);          // never negative
  r = Math.max(0, Math.min(r, w/2, h/2));          // radius can't go below 0
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// --- screens -----------------------------------------------
function show(id){
  ['startScreen','overScreen'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}
function hideScreens(){
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
}

function startGame(){
  reset();
  state = 'play';
  document.getElementById('score').textContent = '0';
  hideScreens();
  
  // initialize audio context on user gesture
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
}

// --- input --------------------------------------------------
function tap(e){
  if(e.target.tagName === 'BUTTON') return;
  if(state === 'play'){ e.preventDefault(); drop(); }
}
canvas.addEventListener('pointerdown', tap);
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); if(state==='play') drop(); }
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

// --- share (the viral hook) --------------------------------
// Guarded init: if the Kakao SDK failed to load (ad blocker, offline,
// sandboxed preview), the game must still boot — share just falls back.
try {
  if (window.Kakao && !Kakao.isInitialized()) {
    Kakao.init('ca7da54d895ecbdd5f6f2d1295df41ec');
  }
} catch(e) { /* SDK unavailable — handled at share time */ }

// One share button, routed by environment:
//  - Real browsers (Chrome / Samsung Internet / Safari): the OS share
//    sheet with the tower screenshot attached — KakaoTalk, Instagram,
//    LINE, Messages all show up. (Note: picking KakaoTalk here delivers
//    image + text as separate messages; that's how its share extension
//    works.)
//  - KakaoTalk in-app browser: it has no OS share sheet, so we send a
//    Kakao feed card instead — screenshot + text + button in one bubble.
//  - Neither available: copy the brag text.

const SHARE_LINK = 'https://zamesdean.github.io';

// Every shared link hands the receiver this score as their target, so
// beating it produces another link, and so on.
function challengeUrl(){
  return score > 0 ? `${SHARE_LINK}/?c=${score}` : SHARE_LINK;
}
// Kept short on purpose. The link already hands over the score as a
// target, and the screenshot and preview card both say STACK RUSH, so
// spelling all that out again just softened it. A dare beats a boast.
function brag(){
  if(score === 0) return `One tap. One tower. 🧱 ${SHARE_LINK}`;
  return targetIsRival && beaten
    ? `Beat your ${target}. Now try ${score}. 🧱 ${challengeUrl()}`
    : `Beat ${score}. 🧱 ${challengeUrl()}`;
}

// Tower + score overlay, drawn synchronously onto the game canvas and
// captured as a PNG file. The next animation frame repaints the game
// before anything hits the screen, so players never see the overlay.
function makeScoreCard(){
  ctx.save();
  ctx.fillStyle = 'rgba(9,12,30,.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd166';
  ctx.font = '900 58px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${score}`, W/2, H/2 - 24);
  ctx.fillStyle = '#f4f6ff';
  ctx.font = '800 24px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('STACK RUSH', W/2, H/2 + 24);
  ctx.fillStyle = '#c7cdea';
  ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('zamesdean.github.io', W/2, H/2 + 64);
  ctx.restore();

  const dataUrl = canvas.toDataURL('image/png');
  const bstr = atob(dataUrl.split(',')[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new File([u8arr], 'stackrush.png', { type: 'image/png' });
}

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const text = brag();

  // 1) OS share sheet whenever the browser has one.
  if (navigator.share) {
    const file = makeScoreCard();
    try {
      // No `title` on purpose: messengers concatenate title + text, which
      // printed "STACK RUSH" twice in the sent message. The screenshot and
      // the link preview already carry the name.
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ text: text, files: [file] });
      } else {
        await navigator.share({ text: text });
      }
    } catch(e) {
      // user closed the sheet — nothing to do
    }
    return;
  }

  // 2) KakaoTalk in-app browser: Kakao feed card with the screenshot.
  if (window.Kakao && Kakao.isInitialized()) {
    const file = makeScoreCard();
    let imageUrl = SHARE_LINK + '/og.jpg';   // static fallback image
    try {
      const res = await Kakao.Share.uploadImage({ file: [file] });
      const infos = res && res.infos;
      if (infos && infos.original && infos.original.url) imageUrl = infos.original.url;
      else if (Array.isArray(infos) && infos[0] && infos[0].url) imageUrl = infos[0].url;
    } catch(err) {
      // upload failed — the card still goes out with the static og.jpg
    }
    try {
      const url = challengeUrl();
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: `SCORE: ${score} - STACK RUSH`,
          description: targetIsRival && beaten
            ? `Beat ${target}. Now it's ${score}.`
            : 'One tap. One tower.',
          imageUrl: imageUrl,
          imageWidth: canvas.width,
          imageHeight: canvas.height,
          link: { mobileWebUrl: url, webUrl: url },
        },
        buttons: [{ title: `Beat ${score}`, link: { mobileWebUrl: url, webUrl: url } }]
      });
      return;
    } catch(e) {
      // fall through to clipboard
    }
  }

  // 3) Last resort: copy the brag text.
  navigator.clipboard.writeText(text).then(toast).catch(()=>{});
});

function toast(){
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// --- boot ---------------------------------------------------
state = 'start';
reset();
document.getElementById('score').textContent = '';
document.getElementById('best').textContent = 'BEST ' + best;

// An arriving challenge takes over the start screen: the number someone
// else hit is the whole pitch, so the generic how-to-play line steps aside.
if(target){
  document.getElementById('chalNum').textContent = target;
  document.getElementById('chalLabel').textContent = targetIsRival ? 'Your target' : 'Your best';
  document.getElementById('chalBanner').classList.remove('gone');
  document.getElementById('startSub').classList.add('gone');
  document.getElementById('startBtn').textContent = 'BEAT IT';
  if(targetIsRival) document.title = `Beat ${target} — STACK RUSH`;
}
requestAnimationFrame(draw);
</script>
