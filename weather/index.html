<title>큰글씨 날씨</title>
<style>
  /* ── 큰글씨 UI 규칙 ────────────────────────────────
     1. 시스템 글씨 배율에 의존하지 않는다 (vmin 고정)
     2. 한 화면에 정보 5개 이하
     3. 세로 배치만, 가로 스크롤 금지
     4. 말줄임표 금지 — 넘치면 줄바꿈
     5. 버튼은 손가락 두 개 너비 이상
     6. 수치 대신 판정과 행동 (수치는 눌렀을 때만)
     7. 광고 넣지 않는다
     8. 미세먼지=얼굴(선), 날씨=컬러 그림(흰 동그라미)
     ─────────────────────────────────────────────── */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #1F2937; color: #fff;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .35s ease;
    min-height: 100vh;
    scroll-snap-type: y mandatory;
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }

  body[data-state="best"]    { background: #1565C0; color: #fff; }
  body[data-state="good"]    { background: #0B6B3A; color: #fff; }
  body[data-state="bad"]     { background: #F07800; color: #1A1A1A; }
  body[data-state="worst"]   { background: #C0392B; color: #fff; }
  body[data-state="neutral"] { background: #1F2937; color: #fff; }

  .pane {
    display: flex; flex-direction: column; align-items: center;
    padding: 3.5vmin 5vmin 4vmin; text-align: center;
    min-height: 100vh;
    scroll-snap-align: start;
  }
  @supports (height: 100dvh) { .pane { min-height: 100dvh; } }

  #pane1 {
    justify-content: space-between;
    min-height: 100vh;
    padding-top: max(4vmin, env(safe-area-inset-top));
  }
  @supports (height: 100dvh) { #pane1 { min-height: 100dvh; } }
  #pane3 { padding-bottom: max(8vmin, env(safe-area-inset-bottom)); }

  .place { font-size: 7.5vmin; font-weight: 800; line-height: 1.25; word-break: keep-all; }
  .place.long { font-size: 5.8vmin; }
  .today { font-size: 4.8vmin; font-weight: 700; opacity: .8; margin-top: 1vmin; }

  .middle {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2vmin; flex: 1; width: 100%; cursor: pointer;
  }

  .face { width: 38vmin; height: 38vmin; display: block; }

  .action {
    font-size: 9.5vmin; font-weight: 800; line-height: 1.35;
    word-break: keep-all; max-width: 94%; white-space: pre-line;
  }
  .sub  { font-size: 5.2vmin; font-weight: 700; opacity: .85; word-break: keep-all; }
  .hint { font-size: 4vmin; font-weight: 600; opacity: .55; }

  .buttons { display: flex; flex-direction: column; gap: 2.5vmin; width: 100%; }

  button {
    font-family: inherit; font-size: 6.5vmin; font-weight: 700; color: inherit;
    background: rgba(255,255,255,.16);
    border: .6vmin solid currentColor; border-radius: 3vmin;
    padding: 3.5vmin 3vmin; min-height: 88px; width: 100%;
    cursor: pointer; word-break: keep-all;
  }
  body[data-state="bad"] button { background: rgba(0,0,0,.12); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 1vmin solid currentColor; outline-offset: .8vmin; }

  .down {
    background: none; border: 0; min-height: 0; width: auto;
    padding: 2vmin 0 0; font-size: 5.2vmin; font-weight: 800; opacity: .75;
  }
  .down .arrow { display: block; font-size: 6.5vmin; line-height: 1; }

  #pane2 .down, #pane3 .down { margin-top: 3vmin; }

  .pane h3 { font-size: 7.5vmin; font-weight: 800; margin: 0 0 2vmin; }
  .rowbox { width: 100%; flex: 1; display: flex; flex-direction: column; }

  .drow {
    display: flex; align-items: center; gap: 2vmin;
    padding: 2.2vmin 0;
    border-bottom: .35vmin solid rgba(255,255,255,.3);
    flex: 1 1 0; min-height: 64px;
  }
  body[data-state="bad"] .drow { border-bottom-color: rgba(0,0,0,.3); }
  .drow:last-child { border-bottom: 0; }

  .drow .lbl  {
    flex: 0 0 25vmin; text-align: left;
    font-size: 5.4vmin; font-weight: 800;
    white-space: nowrap;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    line-height: 1.15;
  }
  .drow .lbl .date { font-size: 3.7vmin; font-weight: 700; opacity: .8; }

  .drow .ico  {
    flex: 0 0 11vmin; width: 11vmin; height: 11vmin;
    display: flex; align-items: center; justify-content: center;
    font-size: 7.4vmin; line-height: 1;
    filter: drop-shadow(0 .3vmin .6vmin rgba(0,0,0,.4));
  }

  .drow .dust {
    flex: 0 0 9.5vmin; width: 9.5vmin; height: 9.5vmin;
    filter: drop-shadow(0 .2vmin .5vmin rgba(0,0,0,.35));
  }

  .drow .note { flex: 1; min-width: 0; text-align: left; font-size: 4.1vmin; font-weight: 700; opacity: .9; white-space: nowrap; }
  .drow .tmp  { flex: 0 0 auto; text-align: right; font-size: 5.6vmin; font-weight: 800; white-space: nowrap; }

  .sheet {
    position: fixed; inset: 0; background: #111; color: #fff;
    padding: 5vmin; overflow-y: auto; display: none; z-index: 10;
  }
  .sheet[data-open="true"] { display: block; }
  .sheet h2 { font-size: 8vmin; font-weight: 800; margin: 2vmin 0 5vmin; text-align: center; }

  #places button { background: rgba(255,255,255,.12); border-color: #fff; color: #fff; }

  #detail[data-state="best"]  { background: #1565C0; color: #fff; }
  #detail[data-state="good"]  { background: #0B6B3A; color: #fff; }
  #detail[data-state="bad"]   { background: #F07800; color: #1A1A1A; }
  #detail[data-state="worst"] { background: #C0392B; color: #fff; }
  #detail button { background: rgba(255,255,255,.16); border-color: currentColor; color: inherit; }
  #detail[data-state="bad"] button { background: rgba(0,0,0,.12); }

  .rows { margin-bottom: 6vmin; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 3vmin; padding: 3.5vmin 0;
    border-bottom: .35vmin solid currentColor;
    font-size: 6.5vmin; font-weight: 700; word-break: keep-all;
  }
  .row .val { font-weight: 800; text-align: right; }

  .badge {
    display: inline-block; margin-left: 2vmin;
    padding: .8vmin 3vmin; border-radius: 2.5vmin;
    border: .4vmin solid currentColor; font-weight: 800; white-space: nowrap;
  }

  .list { display: flex; flex-direction: column; gap: 2.5vmin; margin-bottom: 4vmin; }
  .item { display: flex; gap: 2.5vmin; }
  .item button { flex: 1; }
  .item .del { flex: 0 0 20vmin; width: 20vmin; background: rgba(255,255,255,.06); font-size: 7vmin; }

  .divider { margin: 6vmin 0 4vmin; font-size: 6vmin; font-weight: 800; opacity: .75; }
  .findbar { display: flex; flex-direction: column; gap: 2.5vmin; }

  input[type="text"] {
    font-family: inherit; font-size: 7vmin; font-weight: 700;
    color: #fff; background: rgba(255,255,255,.12);
    border: .6vmin solid #fff; border-radius: 3vmin;
    padding: 3.5vmin 3vmin; min-height: 88px; width: 100%;
  }
  input[type="text"]::placeholder { color: rgba(255,255,255,.5); }

  .msg { font-size: 5.5vmin; font-weight: 700; line-height: 1.5; margin: 4vmin 0; opacity: .8; word-break: keep-all; }

  @media (max-height: 640px) {
    .face { width: 28vmin; height: 28vmin; }
    .action { font-size: 7.5vmin; }
  }
</style>
</head>
<body data-state="neutral">

<section class="pane" id="pane1">
  <div class="place" id="place">성남 분당구</div>
  <div class="today" id="todayDate"></div>
  <div class="middle" id="middle">
    <svg class="face" id="face" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div class="action" id="action">날씨를 가져오는 중입니다</div>
    <div class="sub" id="sub"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="buttons">
    <button id="refresh" type="button">다시 보기</button>
    <button id="change" type="button">지역 바꾸기</button>
    <button class="down" id="godown" type="button">
      <span class="arrow">▼</span>오늘 시간대별
    </button>
  </div>
</section>

<section class="pane" id="pane2">
  <h3>오늘</h3>
  <div class="rowbox" id="todayRows"></div>
  <button class="down" id="goweek" type="button">
    <span class="arrow">▼</span>이번 주
  </button>
</section>

<section class="pane" id="pane3">
  <h3>이번 주</h3>
  <div class="rowbox" id="weekRows"></div>
  <button class="down" id="gotop" type="button">
    <span class="arrow">▲</span>맨 위로
  </button>
</section>

<section class="sheet" id="detail" data-open="false" aria-label="자세한 수치">
  <h2>자세히</h2>
  <div class="rows" id="detailRows"></div>
  <button id="detailClose" type="button">닫기</button>
</section>

<section class="sheet" id="places" data-open="false" aria-label="지역 고르기">
  <h2>지역</h2>
  <div class="list"><div class="item"><button id="useHere" type="button">현재 위치</button></div></div>
  <div class="list" id="savedList"></div>
  <div class="divider">지역 추가</div>
  <div class="findbar">
    <input type="text" id="findInput" placeholder="예: 분당, 강남, 판교동" autocomplete="off">
    <button id="findBtn" type="button">찾기</button>
  </div>
  <div class="msg" id="findMsg"></div>
  <div class="list" id="findList"></div>
  <button id="placesClose" type="button">닫기</button>
</section>

  function rank(code) {
    if (code >= 95) return 5;
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 4;
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 3;
    if (code === 45 || code === 48) return 2;
    if (code >= 2 && code <= 3) return 1;

  }

  function iconFor(code, pop, hour) {
    var r = rank(code);
    if (r === 5) return ICONS.thunder;

    '<circle cx="36" cy="40" r="6" fill="#fff"/><circle cx="64" cy="40" r="6" fill="#fff"/><path d="M30 58 Q50 78 70 58" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>',
    '<circle cx="36" cy="40" r="6" fill="#fff"/><circle cx="64" cy="40" r="6" fill="#fff"/><path d="M32 62 Q50 70 68 62" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>',
    '<circle cx="36" cy="42" r="6" fill="#fff"/><circle cx="64" cy="42" r="6" fill="#fff"/><path d="M32 70 Q50 54 68 70" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>',
    '<path d="M26 32 L44 42" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M74 32 L56 42" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="36" cy="50" r="5.5" fill="#fff"/><circle cx="64" cy="50" r="5.5" fill="#fff"/><path d="M32 74 Q50 56 68 74" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>'
  ];

  function dustIcon(g) {
    if (g == null) return '<span class="dust"></span>';
    return '<svg class="dust" viewBox="0 0 100 100" aria-hidden="true">' +
             '<circle cx="50" cy="50" r="49" fill="' + GRADE_BG[g] + '"/>' + MINI[g] +
           '</svg>';
  }

  function decide(d) {
    var g = dustGrade(d.pm10, d.pm25);
    var todo = [], labels = [], state = "best", face = 0;

    if (d.snow)      { todo.push("미끄러우니 조심하세요"); labels.push("눈"); }
    else if (d.rain) { todo.push("우산 챙기세요");         labels.push("비"); }

    if (g === 3)      { todo.unshift("오늘은 나가지 마세요"); labels.push("미세먼지 매우 나쁨"); }
    else if (g === 2) { todo.unshift("마스크 꼭 쓰세요");     labels.push("미세먼지 나쁨"); }
    else              { labels.push("미세먼지 " + GRADE_NAME[g]); }

    if (d.temp != null && d.temp >= 33)      { todo.push("낮에는 나가지 마세요"); labels.push("더움"); }
    else if (d.temp != null && d.temp <= -8) { todo.push("옷 두껍게 입으세요");   labels.push("추움"); }

    if (g === 3 || (d.temp != null && d.temp >= 33))                         { state = "worst"; face = 3; }
    else if (g === 2 || d.snow || d.rain || (d.temp != null && d.temp <= -8)) { state = "bad"; face = 2; }
    else if (g === 1)                                                        { state = "good";  face = 1; }

    if (!todo.length) todo.push("나가셔도 좋아요");

    var action;
    if (todo.length === 1) action = todo[0];
    else if (d.rain && g === 2) action = "우산이랑 마스크 챙기세요";
    else action = todo.slice(0, 2).join("\n");

    return { state: state, face: face, action: action, label: labels.join(" · ") };
  }

  var BG = { best: "#1565C0", good: "#0B6B3A", bad: "#F07800",
             worst: "#C0392B", neutral: "#1F2937" };

  function setPlace(name) {
    var el = $("place");
    el.textContent = name;
    if (name.length > 7) el.classList.add("long"); else el.classList.remove("long");
  }

  function paint(r, d) {
    body.setAttribute("data-state", r.state);
    $("face").innerHTML = FACES[r.face];
    $("action").textContent = r.action;
    $("sub").textContent = r.label + " · " + Math.round(d.temp) + "\u00B0";
    $("hint").textContent = "화면을 누르면 자세히";
    document.querySelector('meta[name="theme-color"]').setAttribute("content", BG[r.state]);
  }

  function showWaiting() {
    body.setAttribute("data-state", "neutral");
    $("face").innerHTML = FACES[1];
    $("action").textContent = "날씨를 가져오는 중입니다";
    $("sub").textContent = ""; $("hint").textContent = "";
    $("todayRows").innerHTML = ""; $("weekRows").innerHTML = "";
    lastData = null;
  }

  function showError(msg) {
    body.setAttribute("data-state", "neutral");
    $("face").innerHTML = FACES[2];
    $("action").textContent = msg || "인터넷을 확인하고 다시 보기를 눌러 주세요";
    $("sub").textContent = ""; $("hint").textContent = "";
    lastData = null;
  }

  function drow(lbl, code, pop, note, tmp, hour, dg) {
    return '<div class="drow">' +
             '<span class="lbl">' + lbl + '</span>' +
             '<span class="ico" aria-hidden="true">' + iconFor(code, pop, hour) + '</span>' +
             dustIcon(dg) +
             '<span class="note">' + note + '</span>' +
             '<span class="tmp">' + tmp + '</span>' +
           '</div>';
  }

  /* ── 오늘: 지금 시각부터 3시간 간격 ───────────── */
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function drawToday(H, AIR) {
    var now = new Date();
    var nowKey = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" +
                 pad(now.getDate()) + "T" + pad(now.getHours());
    var todayDate = nowKey.slice(0, 10);

    var start = -1;
    for (var i = 0; i < H.time.length; i++) {
      if (H.time[i].slice(0, 13) <= nowKey) continue;
      if (parseInt(H.time[i].slice(11, 13), 10) % 3 !== 0) continue;
      start = i; break;
    }
    if (start < 0) { $("todayRows").innerHTML = '<div class="msg">예보가 없습니다</div>'; return; }

    var html = "";
    for (var k = 0; k < 6; k++) {
      var idx = start + k * 3;
      if (idx >= H.time.length) break;
      var t = H.time[idx];
      var hh = parseInt(t.slice(11, 13), 10);
      var lbl = (t.slice(0, 10) === todayDate ? "" : "내일 ") + hh + "시";
      var code = H.weather_code[idx];
      var pop = H.precipitation_probability ? H.precipitation_probability[idx] : null;
      var w = wordFor(code) || (pop >= 60 ? "비" : "");
      var note = w ? (w + " " + (pop == null ? "" : pop + "%")) : "";
      html += drow(lbl, code, pop, note,
                   Math.round(H.temperature_2m[idx]) + "\u00B0", hh, AIR[t.slice(0, 13)]);
    }
    $("todayRows").innerHTML = html;
  }

  /* ── 이번 주: 7일 ─────────────────────────────── */
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function drawWeek(D, DAYDUST) {
    var html = "";
    var n = Math.min(7, D.time.length);
    for (var i = 0; i < n; i++) {
      var p = D.time[i].split("-");
      var dt = new Date(+p[0], +p[1] - 1, +p[2]);
      var name = (i === 0) ? "오늘" : (i === 1 ? "내일" : DAYS[dt.getDay()]);
      var lbl = name + '<span class="date">' + (+p[1]) + "월 " + (+p[2]) + "일</span>";
      var code = D.weather_code[i];
      html += drow(lbl, code, null, wordFor(code),
                   Math.round(D.temperature_2m_min[i]) + "\u00B0 → " +
                   Math.round(D.temperature_2m_max[i]) + "\u00B0",
                   null, DAYDUST[D.time[i]]);
    }
    $("weekRows").innerHTML = html;
  }

  /* ── 자료 ─────────────────────────────────────── */
  function fetchWeather(lat, lon, label) {
    showWaiting();
    setPlace(label);

    var q = "latitude=" + lat + "&longitude=" + lon + "&timezone=Asia%2FSeoul";

    var w = fetch("https://api.open-meteo.com/v1/forecast?" + q +
        "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code" +
        "&hourly=temperature_2m,weather_code,precipitation_probability" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
        "&forecast_days=8")
      .then(function (r) { return r.json(); });

    var a = fetch("https://air-quality-api.open-meteo.com/v1/air-quality?" + q +
        "&current=pm10,pm2_5&hourly=pm10,pm2_5&forecast_days=7")
      .then(function (r) { return r.json(); })
      .catch(function () { return null; });

    Promise.all([w, a]).then(function (res) {
      var W = res[0], A = res[1];
      if (!W || !W.current) throw new Error("no data");

      var code = W.current.weather_code;
      var precip = W.current.precipitation;

      var d = {
        temp: W.current.temperature_2m,
        humid: W.current.relative_humidity_2m,
        precip: precip,
        rain: (precip > 0) || (code >= 51 && code <= 67) ||
              (code >= 80 && code <= 82) || (code >= 95),
        snow: (code >= 71 && code <= 77) || (code === 85) || (code === 86),
        pm10: (A && A.current) ? A.current.pm10  : null,
        pm25: (A && A.current) ? A.current.pm2_5 : null
      };

      lastData = d;

      /* 지금 시각의 강수확률 찾아두기 */
      if (W.hourly && W.hourly.precipitation_probability) {
        var nw = new Date();
        var key = nw.getFullYear() + "-" + pad(nw.getMonth() + 1) + "-" +
                  pad(nw.getDate()) + "T" + pad(nw.getHours());
        for (var j = 0; j < W.hourly.time.length; j++) {
          if (W.hourly.time[j].slice(0, 13) === key) {
            d.pop = W.hourly.precipitation_probability[j];
            break;
          }
        }
      }

      paint(decide(d), d);
      /* 시간별·일별 미세먼지 등급 표 */
      var AIR = {}, DAYDUST = {};
      if (A && A.hourly && A.hourly.time) {
        for (var m = 0; m < A.hourly.time.length; m++) {
          var key = A.hourly.time[m].slice(0, 13);
          var gg = dustGrade(A.hourly.pm10[m], A.hourly.pm2_5[m]);
          AIR[key] = gg;
          var day = key.slice(0, 10);
          if (DAYDUST[day] == null || gg > DAYDUST[day]) DAYDUST[day] = gg;
        }
      }

      if (W.hourly) drawToday(W.hourly, AIR);
      if (W.daily)  drawWeek(W.daily, DAYDUST);
    }).catch(function () { showError(); });
  }

  function load() {
    window.scrollTo(0, 0);
    var t = new Date();
    $("todayDate").textContent =
      (t.getMonth() + 1) + "월 " + t.getDate() + "일 " + DAYS[t.getDay()] + "요일";
    if (current && current.here) loadHere(true);
    else fetchWeather(current.lat, current.lon, current.name);
  }

  function pickName(j) {
    if (!j) return "내 위치";
    var admin = j.localityInfo && j.localityInfo.administrative;
    if (admin && admin.length) {
      var last = admin[admin.length - 1];
      if (last && last.name) return last.name;
    }
    return j.locality || j.city || j.principalSubdivision || "내 위치";
  }

  function loadHere(silent) {
    /* 실패하면 저장해 둔 지역으로 대신 보여준다 */
    function fallback(msg) {
      if (silent && places.length) {
        fetchWeather(places[0].lat, places[0].lon, places[0].name);
      } else {
        showError(msg);
      }
    }

    if (!navigator.geolocation) {
      fallback("이 폰에서는 현재 위치를 쓸 수 없습니다");
      return;
    }
    if (window.isSecureContext === false) {
      fallback("인터넷 주소로 열어야 위치를 쓸 수 있습니다");
      return;
    }

    showWaiting();
    setPlace("위치 찾는 중");

    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" +
            lat + "&longitude=" + lon + "&localityLanguage=ko")
        .then(function (r) { return r.json(); })
        .then(pickName)
        .catch(function () { return "내 위치"; })
        .then(function (name) { fetchWeather(lat, lon, name); });

    }, function (err) {
      var msg = "위치를 알 수 없습니다. 지역을 골라 주세요";
      if (err && err.code === 1) msg = "위치 사용을 허용해 주세요";
      else if (err && err.code === 3) msg = "위치 찾기가 오래 걸립니다. 다시 눌러 주세요";
      fallback(msg);
    }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
  }

  /* ── 자세히 ───────────────────────────────────── */
  function badge(g) {
    return '<span class="badge" style="background:' + GRADE_BG[g] +
           ';color:' + (g === 2 ? "#1A1A1A" : "#fff") + '">' + GRADE_NAME[g] + '</span>';
  }

  function openDetail() {
    if (!lastData) return;
    var d = lastData;
    var g10 = d.pm10 == null ? null : dustGrade(d.pm10, null);
    var g25 = d.pm25 == null ? null : dustGrade(null, d.pm25);

    var rows = [
      ["기온", Math.round(d.temp) + "\u00B0"],
      ["미세먼지",   d.pm10 == null ? "모름" : Math.round(d.pm10) + badge(g10)],
      ["초미세먼지", d.pm25 == null ? "모름" : Math.round(d.pm25) + badge(g25)],
      ["습도", d.humid == null ? "모름" : Math.round(d.humid) + "%"],
      ["비", d.pop == null ? "모름" : "강수확률 " + d.pop + "%"]
    ];

    $("detailRows").innerHTML = rows.map(function (r) {
      return '<div class="row"><span>' + r[0] + '</span><span class="val">' + r[1] + '</span></div>';
    }).join("");

    $("detail").setAttribute("data-state", body.getAttribute("data-state"));
    $("detail").setAttribute("data-open", "true");
  }

  /* ── 지역 ─────────────────────────────────────── */
  function drawSaved() {
    var box = $("savedList");
    box.innerHTML = "";
    places.forEach(function (p, i) {
      var wrap = document.createElement("div");
      wrap.className = "item";

      var pick = document.createElement("button");
      pick.type = "button";
      pick.textContent = p.name;
      pick.addEventListener("click", function () {
        current = p; save(KEY_CUR, p);
        $("places").setAttribute("data-open", "false");
        load();
      });
      wrap.appendChild(pick);

      if (places.length > 1) {
        var del = document.createElement("button");
        del.type = "button"; del.className = "del";
        del.setAttribute("aria-label", p.name + " 지우기");
        del.textContent = "\u2715";
        del.addEventListener("click", function () {
          places.splice(i, 1); save(KEY_LIST, places); drawSaved();
        });
        wrap.appendChild(del);
      }
      box.appendChild(wrap);
    });
  }

  function find() {
    var q = $("findInput").value.trim();
    $("findList").innerHTML = "";
    if (!q) { $("findMsg").textContent = ""; return; }

    var hits = KR.filter(function (p) {
      return p.name.replace(/\s/g, "").indexOf(q.replace(/\s/g, "")) >= 0;
    }).slice(0, 8);

    if (!hits.length) {
      $("findMsg").textContent = "못 찾았습니다. 시·군·구 이름으로 찾아보세요";
      return;
    }
    $("findMsg").textContent = "";

    hits.forEach(function (p) {
      var wrap = document.createElement("div");
      wrap.className = "item";
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = p.name;
      b.addEventListener("click", function () {
        var exists = places.some(function (x) { return x.name === p.name; });
        if (!exists) { places.push(p); save(KEY_LIST, places); }
        current = p; save(KEY_CUR, p);
        $("findInput").value = "";
        $("findList").innerHTML = ""; $("findMsg").textContent = "";
        drawSaved();
        $("places").setAttribute("data-open", "false");
        load();
      });
      wrap.appendChild(b);
      $("findList").appendChild(wrap);
    });
  }

  /* ── 연결 ─────────────────────────────────────── */
  $("middle").addEventListener("click", openDetail);
  $("detailClose").addEventListener("click", function () {
    $("detail").setAttribute("data-open", "false");
  });

  $("refresh").addEventListener("click", load);
  $("change").addEventListener("click", function () {
    drawSaved();
    $("findList").innerHTML = ""; $("findMsg").textContent = "";
    $("places").setAttribute("data-open", "true");
    $("places").scrollTop = 0;
  });
  $("placesClose").addEventListener("click", function () {
    $("places").setAttribute("data-open", "false");
  });

  $("godown").addEventListener("click", function () {
    $("pane2").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("goweek").addEventListener("click", function () {
    $("pane3").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("gotop").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("useHere").addEventListener("click", function () {
    current = { here: true }; save(KEY_CUR, current);
    $("places").setAttribute("data-open", "false");
    loadHere(false);
  });

  $("findBtn").addEventListener("click", find);
  $("findInput").addEventListener("input", find);
  $("findInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") find();
  });

  drawSaved();
  load();

  /* 앱으로 설치될 수 있도록 등록 */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
